# Miniforge/Conda 环境配置（Windows 打包专用）
# 用法：
#   conda env create -f environment.yml
#   conda activate qz-scada-api
#   .\windows_build\build-windows.ps1

name: qz-scada-api
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # 所有项目依赖统一用 pip 安装，避免 conda/pip 混合冲突
    - Flask
    - Pillow
    - PyYAML
    - astor
    - decorator
    - gast
    - matplotlib
    - numpy
    - opencv-contrib-python==4.7.0.72
    - opencv-python==4.7.0.72
    - opt-einsum
    - paddleocr
    - paddlepaddle==3.0.0
    - pandas
    - protobuf
    - psutil
    - pyclipper
    - requests
    - scipy
    - shapely
    - six
    - torch==2.5.1
    - torchvision==0.20.1
    - tqdm
    - ultralytics
    - pyinstaller>=6.0
